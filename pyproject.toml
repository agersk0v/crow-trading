[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "crow-trading"
version = "0.1.0"
description = "Local research and paper-trading tools for crypto and stocks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt==4.5.15",
    "exchange-calendars==4.11.2",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "yfinance==0.2.66",
]

[dependency-groups]
dev = ["mypy==1.19.1", "pytest==9.0.2", "ruff==0.14.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/crow_trading"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[[tool.mypy.overrides]]
module = ["ccxt.*", "yfinance.*", "pandas.*", "exchange_calendars.*", "pyarrow.*"]
ignore_missing_imports = true
